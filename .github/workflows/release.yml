name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make check
      - name: Build release archives
        run: |
          version="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            version="v0.0.0-dev.$(git rev-parse --short=12 HEAD)"
          fi
          env -u SOURCE_DATE_EPOCH make release VERSION="$version"
      - uses: actions/attest-build-provenance@v4
        if: github.event_name == 'push' && github.ref_type == 'tag'
        with:
          subject-path: |
            dist/release/*.tar.gz
            dist/release/*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: openplexer-release
          path: dist/release/
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: openplexer-release
          path: dist/release
      - name: Publish GitHub release
        working-directory: dist/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS
          flags=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" ./*.tar.gz ./*.zip SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" "${flags[@]}"
