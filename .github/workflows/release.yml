name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Validate release tag
        run: |
          export LC_ALL=C
          if [[ "$GITHUB_REF_TYPE" == tag && ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'invalid release tag, use a tag such as v0.1.0 or v0.1.0-rc.1' >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: make check
      - name: Build release archives
        id: archives
        run: |
          version="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            version="v0.0.0-dev.$(git rev-parse --short=12 HEAD)"
          fi
          env -u SOURCE_DATE_EPOCH go run ./tools/release -version "$version"
          printf 'directory=dist/release/%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v4
        if: github.event_name == 'push' && github.ref_type == 'tag'
        with:
          subject-path: |
            ${{ steps.archives.outputs.directory }}/*.tar.gz
            ${{ steps.archives.outputs.directory }}/*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: openplexer-release
          path: ${{ steps.archives.outputs.directory }}/
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: openplexer-release
          path: dist/release
      - name: Publish GitHub release
        working-directory: dist/release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export LC_ALL=C
          archives=()
          for platform in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64 windows_amd64; do
            extension=tar.gz
            if [[ "$platform" == windows_* ]]; then
              extension=zip
            fi
            archives+=("openplexer_${GITHUB_REF_NAME}_${platform}.${extension}")
          done
          assets=("${archives[@]}" SHA256SUMS)
          shopt -s dotglob nullglob
          downloaded=(*)
          if (( ${#downloaded[@]} != ${#assets[@]} )); then
            echo 'unexpected number of downloaded release files' >&2
            exit 1
          fi
          for file in "${assets[@]}"; do
            if [[ ! -f "$file" || -L "$file" ]]; then
              printf 'expected a regular release file named %s\n' "$file" >&2
              exit 1
            fi
          done
          diff -u <(printf '%s\n' "${archives[@]}" | sort) \
            <(sed -E -e 's/^[0-9a-f]{64}  //' -e 't' -e 's/^/invalid checksum entry: /' SHA256SUMS | sort)
          sha256sum -c SHA256SUMS
          flags=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" "${flags[@]}"
