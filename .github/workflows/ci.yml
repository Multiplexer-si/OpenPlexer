name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make check
      - run: make build

  hub-cloudflare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hub-cloudflare
    env:
      WRANGLER_SEND_METRICS: 'false'
      XDG_CONFIG_HOME: ${{ github.workspace }}/apps/hub-cloudflare/.wrangler-home
      npm_config_cache: ${{ github.workspace }}/apps/hub-cloudflare/.npm-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm test
      - run: npm run deploy -- --dry-run --outdir dist
      - name: Check Worker conformance and daemon policy sync
        run: ./scripts/conformance.sh
