name = "openplexer-hub"
main = "src/index.ts"
compatibility_date = "2026-11-17"
# Keep dot segments visible at the Worker entry point so routing can reject them.
compatibility_flags = ["fetch_legacy_url"]

[vars]
HUB_HOSTNAME = "hub.example.com"
TEAM_ID = "default"
# Set to "1" only for local development.
DEV_MODE = ""

# Set BOOTSTRAP_TOKEN and the versioned wrapping key WRAP_KEY_V1 with Wrangler secrets.
[[durable_objects.bindings]]
name = "TEAM_HUB"
class_name = "TeamHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TeamHub"]

[assets]
directory = "./assets"
binding = "DASHBOARD_ASSETS"
run_worker_first = true
html_handling = "none"
